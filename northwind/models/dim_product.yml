version: 2

models:
  - name: dim_products
    description: Product Dimension. One row per product
    columns:
      - name: productkey
        description: The surrogate key of the product
        tests:
          - not_null
          - unique
      - name: productid
        description: The business / source key of the product
        tests:
          - not_null
          - unique
      - name: productname
        description: The name of the product
      - name: supplierid
        description: Foreign key to the supplier dimension
      - name: categoryid
        description: Foreign key to the category dimension
      - name: quantityperunit
        description: Quantity per unit description
      - name: unitprice
        description: Unit price of the product
      - name: unitsinstock
        description: Units in stock
      - name: unitsonorder
        description: Units on order
      - name: reorderlevel
        description: Reorder level threshold
      - name: discontinued
        description: Indicates whether the product is discontinued